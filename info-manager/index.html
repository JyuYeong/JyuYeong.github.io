<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171A21" media="(prefers-color-scheme: dark)">
<title>Info Manager</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="no-sel">
<!-- 잠금·처음 설정 화면 -->
<div class="gate" id="gate"></div>

<div class="app" id="app" hidden>
  <nav class="side" id="side" aria-label="메뉴"></nav>

  <div class="main">
    <header class="top">
      <h1>Info Manager</h1>
      <span class="sync" id="saveLabel">이 기기에 저장됨</span>
      <button class="icbtn" data-act="lock" aria-label="지금 잠그기" title="지금 잠그기">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
      </button>
      <button class="icbtn only-narrow" data-act="settings" aria-label="설정">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h9M18 8h1M5 16h1M10 16h9"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg>
      </button>
    </header>
    <div class="chips only-narrow" id="chips" role="tablist" aria-label="영역"></div>
    <div class="bar" id="bar"></div>
    <section class="list" id="list" aria-label="목록"></section>
  </div>

  <aside class="panel" id="panel" aria-label="상세"></aside>
  <div class="backdrop" id="backdrop"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dlg"></dialog>
<input type="file" id="iconFile" accept="image/png,image/jpeg,image/webp,image/svg+xml" hidden>

<script type="module" src="app.js"></script>
</body>
</html>
