<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; connect-src 'self' https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171A21" media="(prefers-color-scheme: dark)">
<title>Study Manager</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app" hidden>
  <header class="top">
    <h1 id="title">등록</h1>
    <span class="sync" id="syncLabel">이 기기에 저장됨</span>
  </header>
  <section class="view" id="view"></section>
  <div class="selbar" id="selbar" hidden></div>
  <nav class="tabs" id="tabs" aria-label="메뉴"></nav>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dlg"></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script type="module" src="app.js"></script>
</body>
</html>
