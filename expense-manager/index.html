<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; connect-src 'self' https://www.googleapis.com https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171A21" media="(prefers-color-scheme: dark)">
<title>Expense Manager</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 잠금·처음 설정 화면 -->
<div class="gate" id="gate"></div>

<div class="app" id="app" hidden>
  <nav class="side" id="side" aria-label="메뉴"></nav>
  <div class="main">
    <header class="top">
      <h1 id="title">입력</h1>
      <button class="sync" id="syncLabel" data-act="sync-click">이 기기에 저장됨</button>
      <button class="icbtn" data-act="lock" aria-label="지금 잠그기" title="지금 잠그기">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>
      </button>
    </header>
    <div class="ticker" id="ticker" hidden></div>
    <section class="view" id="view"></section>
    <nav class="tabs" id="tabs" aria-label="메뉴"></nav>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<dialog id="dlg"></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script type="module" src="app.js"></script>
</body>
</html>
