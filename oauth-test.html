<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drive OAuth 테스트</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 24px auto; padding: 0 16px; }
  input { width: 100%; padding: 8px; margin: 4px 0 12px; box-sizing: border-box; }
  button { padding: 10px 14px; margin: 4px 4px 4px 0; }
  pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; word-break: break-all; min-height: 120px; }
  .ok { color: #0a7a2f; } .ng { color: #b00020; }
</style>
</head>
<body>
<h2>Drive OAuth 테스트</h2>

<label>OAuth 클라이언트 ID</label>
<input id="cid" placeholder="xxxx.apps.googleusercontent.com">

<label>스코프</label>
<select id="scope">
  <option value="https://www.googleapis.com/auth/drive.file">drive.file (앱이 만든 파일만)</option>
  <option value="https://www.googleapis.com/auth/drive">drive (전체, 기존 파일 ID 접근용)</option>
</select>

<p>
  <button id="b1">1. 로그인 / 토큰 받기</button>
  <button id="b2">2. tasks-test.json 생성</button>
  <button id="b3">3. 읽기</button>
  <button id="b4">4. 수정(저장)</button>
</p>
<label>파일 ID (2번 실행 시 자동 입력, 기존 파일이면 직접 입력)</label>
<input id="fid">

<pre id="log"></pre>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const $ = id => document.getElementById(id);
let token = null, client = null;

function log(msg, cls) {
  const t = new Date().toLocaleTimeString();
  $('log').insertAdjacentHTML('afterbegin',
    `<div class="${cls || ''}">[${t}] ${String(msg).replace(/</g,'&lt;')}</div>`);
}

$('cid').value = localStorage.getItem('cid') || '';

$('b1').onclick = () => {
  const cid = $('cid').value.trim();
  if (!cid) return log('클라이언트 ID를 입력하세요', 'ng');
  localStorage.setItem('cid', cid);
  if (!window.google || !google.accounts) return log('GIS 라이브러리 로드 실패 (accounts.google.com 차단 여부 확인)', 'ng');
  client = google.accounts.oauth2.initTokenClient({
    client_id: cid,
    scope: $('scope').value,
    callback: r => {
      if (r.error) return log('토큰 오류: ' + r.error + ' ' + (r.error_description || ''), 'ng');
      token = r.access_token;
      log('토큰 수신 성공 (유효시간 ' + r.expires_in + '초)', 'ok');
    },
    error_callback: e => log('팝업/동의 오류: ' + e.type + ' ' + (e.message || ''), 'ng'),
  });
  client.requestAccessToken({ prompt: 'consent' });
};

async function api(url, opt) {
  if (!token) throw new Error('먼저 1번(로그인)을 하세요');
  opt = opt || {};
  opt.headers = Object.assign({ Authorization: 'Bearer ' + token }, opt.headers || {});
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + await r.text());
  return r;
}

$('b2').onclick = async () => {
  try {
    const meta = { name: 'tasks-test.json', mimeType: 'application/json' };
    const body = { version: 1, tasks: [{ id: 'T-test1', title: '테스트 Task', updated_at: new Date().toISOString() }] };
    const boundary = 'bnd' + Date.now();
    const multipart =
      `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(body)}\r\n--${boundary}--`;
    const r = await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name', {
      method: 'POST',
      headers: { 'Content-Type': 'multipart/related; boundary=' + boundary },
      body: multipart,
    });
    const j = await r.json();
    $('fid').value = j.id;
    log('생성 성공: ' + j.name + ' / ID=' + j.id, 'ok');
  } catch (e) { log(e.message, 'ng'); }
};

$('b3').onclick = async () => {
  try {
    const r = await api('https://www.googleapis.com/drive/v3/files/' + $('fid').value.trim() + '?alt=media');
    log('읽기 성공: ' + await r.text(), 'ok');
  } catch (e) { log(e.message, 'ng'); }
};

$('b4').onclick = async () => {
  try {
    const body = { version: 1, tasks: [{ id: 'T-test1', title: '테스트 Task (수정됨)', updated_at: new Date().toISOString() }] };
    await api('https://www.googleapis.com/upload/drive/v3/files/' + $('fid').value.trim() + '?uploadType=media', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    log('수정 성공. 3번으로 다시 읽어 확인하세요', 'ok');
  } catch (e) { log(e.message, 'ng'); }
};
</script>
</body>
</html>
